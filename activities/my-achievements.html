<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>My Achievements</title>
	<link rel="stylesheet" href="/css/general.css">
	<link rel="preload" href="/assets/logos/logo.gif" as="image">
	<script src="/scripts/components/header-component.js"></script>
	<script src="/scripts/components/footer-component.js"></script>
	<script src="/scripts/components/navbar-component.js"></script>
	<link rel="icon" href="/assets/icons/Planet.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		#badge-grid,
		#image-grid,
		#literature-grid,
		#show-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, 280px);
			gap: 1rem;
			justify-content: center;
			background-color: #403175;
			border-radius: 5px;
			box-shadow: 5px 5px 5px 5px #140c38;
			width: 100%;
			box-sizing: border-box;
		}

		#badge-grid,
		#show-grid {
			grid-template-columns: repeat(auto-fill, 150px);
		}

		.badge,
		.show {
			border-radius: 5px;
			padding: 1em;
			margin: 1rem;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		.image,
		.literature {
			background-color: #403175;
			border-radius: 5px;
			box-shadow: 5px 5px 5px 5px #140c38;
			padding: 1em;
			margin: 1rem;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		.loading {
			background-color: #403175;
			border-radius: 5px;
			box-shadow: 5px 5px 5px 5px #140c38;
			width: 100%;
			padding: 1.5rem;
			text-align: center;
			box-sizing: border-box;
		}

		.title-card {
			background-color: #403175;
			border-radius: 5px;
			box-shadow: 5px 5px 5px 5px #140c38;
			width: 100%;
			padding: 1.5rem;
			box-sizing: border-box;
		}

		.title-card .title-row {
			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: space-between;
		}

		.badge-image,
		.image-image,
		.literature-image,
		.show-image {
			width: 100%;
			height: auto;
			display: block;
			border-radius: 6px;
		}

		.badge-title,
		.image-title,
		.literature-title,
		.show-title,
		.loading h4 {
			margin: 0.5rem 0;
			font-size: 1.2rem;
			text-align: center;
		}

		.badge-info p,
		.image-info p,
		.literature-info p,
		.show-info p {
			margin: 0;
			font-size: 0.9rem;
			text-align: center;
		}

		.collapsible {
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			margin-left: 25px;

		}

		.arrow {
			transition: transform 0.2s ease;
		}

		.collapsed .arrow {
			transform: rotate(-90deg);
		}

		.collapsible-content {
			display: block;
		}

		.collapsed+.collapsible-content {
			display: none;
		}

		#achievements {
			margin: 0px 25px;
			box-sizing: border-box;
		}

		main {
			min-height: 65vh;
		}

		#onto-achievements {
			max-width: 90%;
			display: flex;
			justify-items: center;
			margin: auto;
			margin-top: 15px;
			text-align: center;
			min-height: 35vh;
		}

		.input {
			width: 25%;
			padding: 6px 16px;
			border: 2px solid #d9c5ff;
			border-radius: 8px;
			background: #f7f2ff;
			color: #471c81;
			font-size: 1rem;
			transition: border-color 0.2s ease, box-shadow 0.2s ease;
			margin-bottom: 15px;
			margin-top: 15px;
		}

		.input:focus {
			border-color: #8c6cff;
			box-shadow: 0 0 6px rgba(140, 108, 255, 0.5);
			outline: none;
		}

		@media (max-width: 600px) {
			h1 {
				font-size: 1.2em;
			}
		}
	</style>
</head>

<body>
	<header id="header">
		<main-header></main-header>
	</header>
	<main>
		<nav-bar></nav-bar>
		<div id="onto-achievements" class="card" style="display: none;">
			<img src="/assets/logos/achievements.png" alt="Inventory" style="display: inline-block; max-width: 100%;">
			<br>
			<span> Enter your username below to check out the Achievements you've completed! </span>
			<br>
			<input class="input" id="username" type="text" placeholder="Enter Username..."></input>
			<br>
			<button id="achievement-button" class="button" style="width: 75%; margin: auto;" disabled>Go To
				Achievements</button>
		</div>
		<div id="achievements">
			<div class="title-card" style="margin-top: 15px;">
				<div class="title-row">
					<h1 id="title"> X's Achievemnts</h1>
					<div style="	display: flex;flex-direction: row;align-items: center;">
						<img src="/assets/icons/coin.gif" style="height:30px; display: inline-block;">
						<h1 id="coin-count">Loading Coins</h1>
					</div>
				</div>
				<hr>
			</div>


			<article id="badges">
				<div id="badge-header" class="collapsible"><span class="arrow">▼</span>
					<h2>Badges</h2>
				</div>
				<div id="badge-body" class="collapsible-content">
					<div id="badge-loading" class="loading">
						<h4>Loading Badges</h4>
					</div>
					<div id="badge-grid">
					</div>
				</div>
			</article>

			<article id="shows">
				<div id="show-header" class="collapsible"><span class="arrow">▼</span>
					<h2>Shows</h2>
				</div>
				<div id="show-body" class="collapsible-content">
					<div id="show-loading" class="loading">
						<h4>Loading Shows</h4>
					</div>
					<div id="show-grid">
					</div>
				</div>
			</article>


			<article id="images" style="display: none;">
				<div id="image-header" class="collapsible"><span class="arrow">▼</span>
					<h2>Art Entries</h2>
				</div>
				<div id="image-body" class="collapsible-content">
					<div id="image-loading" class="loading">
						<h4>Coming Soon!</h4>
					</div>
					<div id="image-grid">
					</div>
				</div>
			</article>

			<article id="literatures" style="display: none;">
				<div id="literature-header" class="collapsible"><span class="arrow">▼</span>
					<h2>Literature Entries</h2>
				</div>
				<div id="literature-body" class="collapsible-content">
					<div id="literature-loading" class="loading">
						<h4>Coming Soon!</h4>
					</div>
					<div id="literaturet-grid">
					</div>
				</div>
			</article>

	</main>
	<footer>
		<main-footer></main-footer>
	</footer>
	<script type="module" src="/scripts/nav-bar.js"></script>
	<script type="module" src="/scripts/my-achievements.js"></script>
</body>

</html>
